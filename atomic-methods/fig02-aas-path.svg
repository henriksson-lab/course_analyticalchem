<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Atomic absorption measures attenuation of source light</title><desc id="d">The sample must be converted into an appropriate free-atom population; flame and graphite furnace differ in how this is achieved.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Atomic absorption measures attenuation of source light</text><rect x="40.0" y="155" width="246.25" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="60.0" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Element lamp</text><text x="60.0" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Element-specific</text><text x="60.0" y="359" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">source</text><path d="M294.25 270 L323.25 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="331.25" y="155" width="246.25" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="351.25" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Atomiser</text><text x="351.25" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Free atoms absorb</text><path d="M585.5 270 L614.5 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="622.5" y="155" width="246.25" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="642.5" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Wavelength</text><text x="642.5" y="238" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">selection</text><text x="642.5" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Isolate the</text><text x="642.5" y="359" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">target line</text><path d="M876.75 270 L905.75 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="913.75" y="155" width="246.25" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="933.75" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Detector</text><text x="933.75" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Compare</text><text x="933.75" y="359" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">transmitted light</text><text x="50" y="465" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">The sample must be converted into an appropriate free-atom population; flame and</text><text x="50" y="503" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">graphite furnace differ in how this is achieved.</text></g></svg>