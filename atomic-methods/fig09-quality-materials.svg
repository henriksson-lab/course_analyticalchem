<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Blank, independent check and spike ask different questions</title><desc id="d">A blank, independent reference check and a sample spike examine different parts of the measurement.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Blank, independent check and spike ask different questions</text><rect x="45" y="140" width="340" height="285" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="65" y="185" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Method blank</text><text x="65" y="370" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Does the procedure</text><text x="65" y="399" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">introduce analyte?</text><rect x="430" y="140" width="340" height="285" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="450" y="185" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Independent check</text><text x="450" y="370" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Does the calibration</text><text x="450" y="399" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">recover a known</text><text x="450" y="428" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">quantity?</text><rect x="815" y="140" width="340" height="285" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="835" y="185" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Sample spike</text><text x="835" y="370" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">How does this matrix</text><text x="835" y="399" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">respond to added</text><text x="835" y="428" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">analyte?</text><text x="60" y="505" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">One successful check does not replace the others.</text></g></svg>