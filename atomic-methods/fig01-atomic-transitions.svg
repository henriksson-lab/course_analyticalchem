<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Absorption and emission reverse the energy change</title><desc id="d">Absorption moves an atom from lower to higher energy, while emission releases a photon during a transition from higher to lower energy.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Absorption and emission reverse the energy change</text><path d="M100 180 L470 180 M100 410 L470 410 M730 180 L1100 180 M730 410 L1100 410" stroke="#123e52" stroke-width="4"/><path d="M280 390 L280 195" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><path d="M910 195 L910 390" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><text x="110" y="125" font-size="32" fill="#123e52" font-weight="normal" text-anchor="start">Absorption</text><text x="735" y="125" font-size="32" fill="#123e52" font-weight="normal" text-anchor="start">Emission</text><text x="70" y="465" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">Atom gains energy from light</text><text x="705" y="465" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">Excited atom releases light</text><text x="65" y="530" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">The photon energy matches the difference between allowed states.</text></g></svg>