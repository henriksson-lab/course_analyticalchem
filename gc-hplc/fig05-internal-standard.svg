<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">An internal standard follows selected sources of variation</title><desc id="d">The ratio cannot repair coelution, analyte loss before standard addition, or different behaviour of analyte and standard.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">An internal standard follows selected sources of variation</text><rect x="40.0" y="155" width="343.3333333333333" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="60.0" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Add a known amount</text><text x="60.0" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Same final concentration</text><text x="60.0" y="359" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">in this example</text><path d="M391.3333333333333 270 L420.3333333333333 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="428.3333333333333" y="155" width="343.3333333333333" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="448.3333333333333" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Measure both peaks</text><text x="448.3333333333333" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Analyte and standard</text><text x="448.3333333333333" y="359" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">must be resolved</text><path d="M779.6666666666666 270 L808.6666666666666 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="816.6666666666666" y="155" width="343.3333333333333" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="836.6666666666666" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Calibrate area ratio</text><text x="836.6666666666666" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Shared injection effects</text><text x="836.6666666666666" y="359" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">can cancel</text><text x="50" y="465" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">The ratio cannot repair coelution, analyte loss before standard addition, or</text><text x="50" y="503" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">different behaviour of analyte and standard.</text></g></svg>