<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Repeated exchange controls the average migration speed</title><desc id="d">Solutes repeatedly exchange between mobile and stationary phases. A greater stationary-phase residence fraction delays average migration.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Repeated exchange controls the average migration speed</text><rect x="70" y="125" width="1060" height="145" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="90" y="170" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Mobile phase: carries solute along the column</text><text x="90" y="215" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">A solute moves while it occupies the mobile phase</text><rect x="70" y="345" width="1060" height="145" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="90" y="390" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Stationary phase: retains solute</text><text x="90" y="435" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Longer residence gives slower average migration</text><path d="M350 290 L350 330" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><path d="M850 330 L850 290" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/></g></svg>