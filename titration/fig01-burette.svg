<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">A titration combines known concentration and volume</title><desc id="d">A burette delivers standardised titrant to a known sample aliquot. Endpoint detection estimates the stoichiometric equivalence point.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">A titration combines known concentration and volume</text><path d="M245 110 L295 110 L295 300 L270 335 L270 370" fill="none" stroke="#087b85" stroke-width="5"/><line x1="247" y1="130" x2="265" y2="130" stroke="#123e52" stroke-width="2"/><line x1="247" y1="155" x2="265" y2="155" stroke="#123e52" stroke-width="2"/><line x1="247" y1="180" x2="265" y2="180" stroke="#123e52" stroke-width="2"/><line x1="247" y1="205" x2="265" y2="205" stroke="#123e52" stroke-width="2"/><line x1="247" y1="230" x2="265" y2="230" stroke="#123e52" stroke-width="2"/><line x1="247" y1="255" x2="265" y2="255" stroke="#123e52" stroke-width="2"/><line x1="247" y1="280" x2="265" y2="280" stroke="#123e52" stroke-width="2"/><path d="M220 380 L320 380 L320 420 L390 490 L150 490 L220 420 Z" fill="#edf6f8" stroke="#087b85" stroke-width="4"/><text x="355" y="150" font-size="30" fill="#123e52" font-weight="normal" text-anchor="start">Standardised titrant</text><text x="355" y="200" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">Delivered volume = final − initial</text><text x="355" y="270" font-size="30" fill="#123e52" font-weight="normal" text-anchor="start">Known sample aliquot</text><text x="355" y="320" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">Indicator or electrode detects an endpoint</text><rec