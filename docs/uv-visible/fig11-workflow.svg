<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">workflow</title><desc id="desc">Define the measurand, prepare and measure, calibrate and check, then correct preparation factors and report uncertainty. Withhold unsupported results.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#087b85"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#123e52} .title{font-size:36px;font-weight:bold}.label{font-size:27px}.small{font-size:23px}.box{fill:#edf6f8;stroke:#087b85;stroke-width:3}.flow{stroke:#087b85;stroke-width:5;marker-end:url(#arrow)}</style><rect width="1200" height="580" fill="#fff"/>
<text x="55" y="70" class="title">A reportable number needs more than a fitted line</text>
<rect x="50" y="140" width="310" height="140" rx="16" class="box"/><text x="80" y="195" class="label">Define the measurand</text><text x="80" y="242" class="small">Iron in supplied water</text>
<path d="M380 210 L435 210" class="flow"/>
<rect x="455" y="140" width="300" height="140" rx="16" class="box"/><text x="485" y="195" class="label">Prepare and measure</text><text x="485" y="242" class="small">Colour, wavelength, blank</text>
<path d="M775 210 L830 210" class="flow"/>
<rect x="850" y="140" width="300" height="140" rx="16" class="box"/><text x="880" y="195" class="label">Calibrate and check</text><text x="880" y="242" class="small">Range, residuals, QC</text>
<path d="M1000 300 L1000 360 L360 360" fill="none" class="flow"/>
<rect x="65" y="390" width="1070" height="125" rx="16" fill="#fde5d5" stroke="#c35420" stroke-width="3"/><text x="100" y="440" class="label">Correct preparation factors → state uncertainty → justify the result</text><text x="100" y="485" class="small">Withhold a number when range, QC, or chemical assumptions fail.</text>
</svg>