<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Potential is measured between two electrodes</title><desc id="d">An indicator electrode and reference electrode contact the same sample and connect to a high-input-impedance meter. There is negligible net measurement current.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Potential is measured between two electrodes</text><path d="M90 240 L90 460 L710 460 L710 240" fill="#edf6f8" stroke="#087b85" stroke-width="4"/><path d="M220 300 L220 120 L470 120 L470 300 M570 300 L570 120" fill="none" stroke="#123e52" stroke-width="4"/><rect x="345" y="80" width="280" height="100" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="365" y="125" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">High-impedance</text><text x="365" y="163" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">meter</text><text x="120" y="510" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">Same sample solution</text><text x="775" y="220" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">Indicator electrode</text><text x="775" y="265" font-size="23" fill="#123e52" font-weight="normal" text-anchor="start">Selective membrane response</text><text x="775" y="355" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">Reference electrode</text><text x="775" y="400" font-size="23" fill="#123e52" font-weight="normal" text-anchor="start">Stable potential and junction</text><path d="M750 240 L590 310" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><path d="M750 365 L240 330" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/></g></svg>