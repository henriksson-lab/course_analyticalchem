<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">The same sample supports different questions</title><desc id="d">A selective chloride procedure and conductivity do not have the same measurand.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">The same sample supports different questions</text><rect x="50" y="155" width="310" height="240" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="70" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Water sample</text><text x="70" y="340" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Cl⁻, Na⁺, Ca²⁺, other</text><text x="70" y="369" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">ions</text><path d="M385 270 L510 195" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><path d="M385 290 L510 390" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="540" y="115" width="600" height="150" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="560" y="160" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Chloride-selective procedure</text><text x="560" y="210" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Aims at a particular chemical quantity</text><rect x="540" y="335" width="600" height="150" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="560" y="380" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Conductivity measurement</text><text x="560" y="430" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Responds to several mobile ionic species</text></g></svg>