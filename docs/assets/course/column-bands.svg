<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Retention separates migrating sample bands</title><desc id="d">A snapshot shows two separated bands moving through a column. The less retained band is further towards the outlet; time-resolved detection gives peaks.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Retention separates migrating sample bands</text><rect x="80" y="150" width="1040" height="220" rx="35" fill="#edf6f8" stroke="#087b85" stroke-width="4"/><rect x="340" y="155" width="70" height="210" fill="#c35420" opacity=".8"/><rect x="680" y="155" width="100" height="210" fill="#087b85" opacity=".8"/><path d="M120 430 L1080 430" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><text x="380" y="485" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">Mobile phase moves towards the detector</text><text x="320" y="115" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">More retained band</text><text x="675" y="115" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Less retained band</text><text x="80" y="535" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">This is one snapshot inside a column; the detector sees peaks over time.</text></g></svg>