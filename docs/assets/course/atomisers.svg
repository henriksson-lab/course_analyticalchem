<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Different atomisers create different measurement conditions</title><desc id="d">Flame AAS, graphite furnace AAS and ICP optical emission differ in introduction, atomisation and detection conditions.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Different atomisers create different measurement conditions</text><rect x="45" y="140" width="340" height="290" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="65" y="185" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Flame AAS</text><text x="65" y="375" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Continuous introduction;</text><text x="65" y="404" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">selected elements</text><rect x="430" y="140" width="340" height="290" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="450" y="185" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Graphite furnace AAS</text><text x="450" y="375" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Small aliquot;</text><text x="450" y="404" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">programmed heating</text><rect x="815" y="140" width="340" height="290" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="835" y="185" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">ICP optical emission</text><text x="835" y="375" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Plasma excitation; many</text><text x="835" y="404" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">emission lines</text><text x="60" y="505" font-size="25" fill="#123e52" font-weight="normal" text-anchor="start">Sensitivity, matrix effects, throughput and sample volume all affect method choice.</text></g></svg>