<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">light path</title><desc id="desc">Selected light passes through a one-centimetre cuvette. The detector measures transmitted intensity I relative to reference intensity I zero.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#087b85"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#123e52} .title{font-size:36px;font-weight:bold}.label{font-size:27px}.small{font-size:23px}.box{fill:#edf6f8;stroke:#087b85;stroke-width:3}.flow{stroke:#087b85;stroke-width:5;marker-end:url(#arrow)}</style><rect width="1200" height="580" fill="#fff"/>
<text x="55" y="65" class="title">Absorption changes how much light reaches the detector</text>
<rect x="65" y="170" width="190" height="170" rx="20" class="box"/><text x="100" y="240" class="label">Selected</text><text x="95" y="280" class="label">wavelength</text>
<path d="M270 250 L455 250" class="flow"/><text x="330" y="210" class="label">I₀</text>
<rect x="480" y="140" width="190" height="240" rx="10" fill="#fde5d5" stroke="#c35420" stroke-width="4"/><text x="515" y="235" class="label">Coloured</text><text x="515" y="277" class="label">solution</text><path d="M490 410 L660 410" stroke="#123e52" stroke-width="3"/><text x="510" y="455" class="small">Path: 1.00 cm</text>
<path d="M690 250 L880 250" class="flow"/><text x="770" y="210" class="label">I</text>
<rect x="900" y="170" width="235" height="170" rx="20" class="box"/><text x="940" y="265" class="label">Detector</text>
<text x="85" y="525" class="label">Transmittance T = I / I₀</text><text x="610" y="525" class="label">Absorbance A = −log₁₀(T)</text>
</svg>