<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Choose a method that answers the chemical question</title><desc id="d">Different analytical questions call for elemental detection, molecular separation, titration or ion-activity measurement.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Choose a method that answers the chemical question</text><rect x="55" y="130" width="500" height="150" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="75" y="175" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Element amount</text><text x="75" y="225" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Atomisation + elemental detection</text><rect x="645" y="130" width="500" height="150" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="665" y="175" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Molecular identity and amount</text><text x="665" y="225" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Separation + suitable detection</text><rect x="55" y="340" width="500" height="150" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="75" y="385" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Bulk reactive quantity</text><text x="75" y="435" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Stoichiometric titration, if</text><text x="75" y="464" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">selective enough</text><rect x="645" y="340" width="500" height="150" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="665" y="385" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Ion activity under conditions</text><text x="665" y="435" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Selective electrode + reference</text><text x="665" y="464" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">system</text></g></svg>