<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">An electrode responds to activity</title><desc id="d">Activity is dimensionless and related to concentration by an activity coefficient and standard concentration. Matching ionic strength supports calibration transfer.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">An electrode responds to activity</text><rect x="60" y="145" width="500" height="270" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="80" y="190" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Concentration c</text><text x="80" y="360" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Amount per solution volume</text><rect x="650" y="145" width="490" height="270" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="670" y="190" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Activity a = γ c / c°</text><text x="670" y="360" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Effective thermodynamic composition</text><text x="65" y="480" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Matching ionic-strength conditions helps a concentration calibration transfer.</text><text x="65" y="525" font-size="25" fill="#123e52" font-weight="normal" text-anchor="start">Interfering ions and liquid-junction changes can still affect the response.</text></g></svg>