<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Partitioning moves analyte; it does not create it</title><desc id="d">Two immiscible phases share analyte at distribution ratio nine. The organic ten millilitres holds 81.8 percent of the mass.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Partitioning moves analyte; it does not create it</text><rect x="100" y="120" width="400" height="320" fill="#e0f2f3" stroke="#087b85" stroke-width="3"/><rect x="102" y="122" width="396" height="130" fill="#fde5d5"/><text x="140" y="180" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Extracting phase: 10 mL</text><text x="140" y="225" font-size="24" fill="#123e52" font-weight="normal" text-anchor="start">Concentration = 9 × c aqueous</text><text x="140" y="325" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Aqueous phase: 20 mL</text><text x="140" y="375" font-size="24" fill="#123e52" font-weight="normal" text-anchor="start">Concentration = c aqueous</text><path d="M540 255 L680 255" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="720" y="145" width="410" height="260" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="740" y="190" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Ideal equilibrium: D = 9</text><text x="740" y="350" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Recovered fraction = 90 / 110</text><text x="740" y="379" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">= 81.8%</text><text x="70" y="515" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">Assume immiscible phases, constant volumes and no chemical change.</text></g></svg>