<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Define a quantity before measuring it</title><desc id="d">Four parts of a measurand: analyte and matrix, material scope, quantity and unit, and procedure.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Define a quantity before measuring it</text><rect x="60" y="130" width="500" height="135" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="80" y="175" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Analyte and matrix</text><text x="80" y="210" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Chloride in supplied filtered water</text><rect x="640" y="130" width="500" height="135" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="660" y="175" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Material and scope</text><text x="660" y="210" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Collected location and sampling</text><text x="660" y="239" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">time</text><rect x="60" y="315" width="500" height="135" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="80" y="360" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Quantity and unit</text><text x="80" y="395" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Mass concentration: mg chloride/L</text><rect x="640" y="315" width="500" height="135" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="660" y="360" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Procedure and conditions</text><text x="660" y="395" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Filtration changes the material</text><text x="660" y="424" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">measured</text></g></svg>