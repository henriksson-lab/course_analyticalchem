<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Amount and concentration answer different questions</title><desc id="d">Taking a larger volume increases the collected mass at unchanged concentration, assuming a homogeneous solution.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Amount and concentration answer different questions</text><rect x="40.0" y="155" width="343.3333333333333" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="60.0" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Mass: 5.00 mg</text><text x="60.0" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Amount of chloride</text><path d="M391.3333333333333 270 L420.3333333333333 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="428.3333333333333" y="155" width="343.3333333333333" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="448.3333333333333" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Volume: 0.250 L</text><text x="448.3333333333333" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Amount of solution</text><path d="M779.6666666666666 270 L808.6666666666666 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="816.6666666666666" y="155" width="343.3333333333333" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="836.6666666666666" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Concentration: 20.0</text><text x="836.6666666666666" y="238" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">mg/L</text><text x="836.6666666666666" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Mass divided by volume</text><text x="50" y="465" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Taking a larger volume increases the collected mass at unchanged concentration,</text><text x="50" y="503" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">assuming a homogeneous solution.</text></g></svg>