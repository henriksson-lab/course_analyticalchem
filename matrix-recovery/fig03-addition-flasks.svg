<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Standard addition keeps the matrix fraction constant</title><desc id="d">Five flasks have equal sample aliquots and equal final volume, but increasing standard additions expressed as final-flask concentration.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Standard addition keeps the matrix fraction constant</text><path d="M125 150 L165 150 L165 245 L225 365 L65 365 L125 245 Z" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="60" y="420" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">+0.0 mg/L</text><text x="65" y="460" font-size="21" fill="#123e52" font-weight="normal" text-anchor="start">in final flask</text><path d="M350 150 L390 150 L390 245 L450 365 L290 365 L350 245 Z" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="285" y="420" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">+0.5 mg/L</text><text x="290" y="460" font-size="21" fill="#123e52" font-weight="normal" text-anchor="start">in final flask</text><path d="M575 150 L615 150 L615 245 L675 365 L515 365 L575 245 Z" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="510" y="420" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">+1.0 mg/L</text><text x="515" y="460" font-size="21" fill="#123e52" font-weight="normal" text-anchor="start">in final flask</text><path d="M800 150 L840 150 L840 245 L900 365 L740 365 L800 245 Z" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="735" y="420" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">+1.5 mg/L</text><text x="740" y="460" font-size="21" fill="#123e52" font-weight="normal" text-anchor="start">in final flask</text><path d="M1025 150 L1065 150 L1065 245 L1125 365 L965 365 L1025 245 Z" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="960" y="420" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">+2.0 mg/L</text><text x="965" y="460" font-size="21" fill="#123e52" font-weight="normal" text-anchor="start">in final flask</text><text x="55" y="110" font-size="28" fill="#123e52" font-weight="normal" text-anchor="start">Every flask: 10.00 mL sample made to 25.00 mL total</text><text x="55" y="525" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Vary the added standard; keep the sample fraction and final volume fixed.</text></g></svg>