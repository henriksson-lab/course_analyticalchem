<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">The bottle contents can change before measurement</title><desc id="d">Storage can change composition by reactions, adsorption or biological processes. Preservation is method dependent.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">The bottle contents can change before measurement</text><rect x="55" y="145" width="330" height="260" rx="16" fill="#fde5d5" stroke="#087b85" stroke-width="3"/><text x="75" y="190" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Chemical change</text><text x="75" y="350" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Oxidation or</text><text x="75" y="379" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">precipitation</text><rect x="435" y="145" width="330" height="260" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="455" y="190" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Surface transfer</text><text x="455" y="350" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Adsorption to the</text><text x="455" y="379" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">container</text><rect x="815" y="145" width="330" height="260" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="835" y="190" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Biological change</text><text x="835" y="350" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Growth or consumption</text><text x="65" y="480" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">Preservation must fit the measurand and method. A treatment that preserves an</text><text x="65" y="518" font-size="26" fill="#123e52" font-weight="normal" text-anchor="start">element can change its chemical form.</text></g></svg>