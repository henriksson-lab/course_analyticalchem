<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Represent the material, not the convenient part</title><desc id="d">Equal-mass top, middle and bottom strata have different iron concentrations. Top-only sampling is biased.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">Represent the material, not the convenient part</text><rect x="110" y="115" width="360" height="360" fill="#edf6f8" stroke="#087b85" stroke-width="4"/><rect x="112" y="117" width="356" height="118" fill="#d8edf0"/><text x="145" y="185" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Top: 8 mg/kg</text><rect x="112" y="237" width="356" height="118" fill="#b3d6db"/><text x="145" y="305" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Middle: 14 mg/kg</text><rect x="112" y="357" width="356" height="118" fill="#74b3bd"/><text x="145" y="425" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Bottom: 25 mg/kg</text><path d="M485 175 L620 175" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><path d="M485 295 L620 295" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><path d="M485 415 L620 415" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="660" y="135" width="470" height="300" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="680" y="180" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Sample all defined strata</text><text x="680" y="380" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Equal masses here: overall mean</text><text x="680" y="409" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">15.67 mg/kg</text><text x="75" y="525" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Several precise top-only measurements still miss the lower material.</text></g></svg>