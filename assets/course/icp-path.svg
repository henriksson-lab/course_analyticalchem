<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">ICP optical emission measures light produced by the sample</title><desc id="d">Elemental emission does not preserve the original molecular identity or oxidation-state distribution of the sample.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4z" fill="#087b85"/></marker></defs><rect width="1200" height="560" fill="white"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="34" fill="#123e52" font-weight="bold" text-anchor="start">ICP optical emission measures light produced by the sample</text><rect x="40.0" y="155" width="246.25" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="60.0" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Nebuliser /</text><text x="60.0" y="238" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">aerosol</text><text x="60.0" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Introduce sample</text><path d="M294.25 270 L323.25 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="331.25" y="155" width="246.25" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="351.25" y="200" font-size="27" fill="#123e52" font-weight="normal" text-anchor="start">Plasma</text><text x="351.25" y="330" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">Atomise and</text><text x="351.25" y="359" font-size="22" fill="#123e52" font-weight="normal" text-anchor="start">excite</text><path d="M585.5 270 L614.5 270" fill="none" stroke="#087b85" stroke-width="5" marker-end="url(#arr)"/><rect x="622.5" y="155" width="246.25" height="230" rx="16" fill="#edf6f8" stroke="#087b85" stroke-width="3"/><text x="642.5" y="200" font-size="27" fill="#123e52" font-weight="normal" t